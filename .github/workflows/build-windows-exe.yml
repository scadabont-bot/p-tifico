name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        run: python -m pip install "pyinstaller==6.16.0" "pillow==12.3.0"

      - name: Validate source and behavioral tests
        shell: pwsh
        run: |
          $source = "SCADA_BONT_V50_FIELD_MAP (2) - RR FIXNEW01.py"
          python -m py_compile $source
          if ($LASTEXITCODE -ne 0) {
            throw "Python compilation failed."
          }
          python -m unittest discover -v
          if ($LASTEXITCODE -ne 0) {
            throw "Behavioral tests failed."
          }
          $env:SCADA_SELF_TEST = "1"
          python $source
          $selfTestExit = $LASTEXITCODE
          Remove-Item Env:\SCADA_SELF_TEST
          if ($selfTestExit -ne 0) {
            throw "Source self-test exited with code $selfTestExit."
          }
          $env:SCADA_UI_SELF_TEST = "1"
          python $source
          $uiSmokeExit = $LASTEXITCODE
          Remove-Item Env:\SCADA_UI_SELF_TEST
          if ($uiSmokeExit -ne 0) {
            throw "Source login UI smoke test exited with code $uiSmokeExit."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not installed."
          }

      - name: Build GUI executable
        run: pyinstaller --noconfirm --clean p-tifico-backup.spec

      - name: Build Windows installers
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "installer\p-tifico-backup.iss"
          & $compiler `
            "/DMyOutputBaseFilename=p-tifico-backup-PC2-Setup" `
            "installer\p-tifico-backup.iss"

      - name: Install and verify both packaged applications
        shell: pwsh
        run: |
          $installerNames = @(
            "p-tifico-backup-Setup.exe",
            "p-tifico-backup-PC2-Setup.exe"
          )
          foreach ($installerName in $installerNames) {
            $installer = Resolve-Path (Join-Path "dist" $installerName)
            $installDir = Join-Path `
              $env:RUNNER_TEMP `
              ([IO.Path]::GetFileNameWithoutExtension($installerName))
            $install = Start-Process `
              -FilePath $installer `
              -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" `
              -PassThru `
              -Wait
            if ($install.ExitCode -ne 0) {
              throw "$installerName exited with code $($install.ExitCode)."
            }

            $requiredFiles = @(
              "p-tifico-backup.exe",
              "SCADA_BONT.ico",
              "RUNMONITORING FINAL.png",
              "G1MONITOR.jpg.png",
              "G2MONITOR.jpg.png",
              "SYSTEMCONFIG_DARK.png",
              "AUXILIARY_MATCHED.png",
              "MANUAL_MAPPING_G1_G2.png",
              "MANUAL_COMMUNICATION_SETTINGS.png",
              "MANUAL_PROCESS_TREND.png",
              "MANUAL_BACKUP_EXPLORER.png",
              "MANUAL_MONITOR_TV_BREAKER.png",
              "MONITOR V55.html",
              "CommunicationConfig.json",
              "MQTTConfig.json",
              "UIRealtimeBindings.json",
              "MonitorTVConfig.json",
              "CBZ8000AppData.json"
            )
            foreach ($file in $requiredFiles) {
              if (-not (Test-Path (Join-Path $installDir $file))) {
                throw "$installerName missing installed file: $file"
              }
            }

            $communication = Get-Content `
              (Join-Path $installDir "CommunicationConfig.json") `
              -Raw | ConvertFrom-Json
            if (
              $communication.mode -ne "master_slave" -or
              $communication.master_ip -ne "10.100.163.150" -or
              $communication.peer_ip -ne "10.100.163.149" -or
              [string]::IsNullOrWhiteSpace($communication.relay_token) -or
              $communication.relay_token.Length -lt 32 -or
              $communication.relay_token -eq "SCADA-BONT-PARALLEL-149-150"
            ) {
              throw "$installerName has an invalid PC1/PC2 communication configuration."
            }

            $listSettings = @(
              Get-ChildItem $installDir -Filter "ListSetting *.csv"
            )
            $statusSettings = @(
              Get-ChildItem $installDir -Filter "StatusSetting *.csv"
            )
            if ($listSettings.Count -lt 23 -or $statusSettings.Count -lt 24) {
              throw (
                "$installerName has incomplete settings: " +
                "$($listSettings.Count) ListSetting and " +
                "$($statusSettings.Count) StatusSetting files."
              )
            }

            $env:SCADA_SELF_TEST = "1"
            $selfTest = Start-Process `
              -FilePath (Join-Path $installDir "p-tifico-backup.exe") `
              -WorkingDirectory $installDir `
              -PassThru `
              -Wait
            Remove-Item Env:\SCADA_SELF_TEST
            if ($selfTest.ExitCode -ne 0) {
              throw "$installerName self-test exited with code $($selfTest.ExitCode)."
            }
            $env:SCADA_UI_SELF_TEST = "1"
            $uiSmoke = Start-Process `
              -FilePath (Join-Path $installDir "p-tifico-backup.exe") `
              -WorkingDirectory $installDir `
              -PassThru `
              -Wait
            Remove-Item Env:\SCADA_UI_SELF_TEST
            if ($uiSmoke.ExitCode -ne 0) {
              throw "$installerName login UI smoke test exited with code $($uiSmoke.ExitCode)."
            }


            $application = Start-Process `
              -FilePath (Join-Path $installDir "p-tifico-backup.exe") `
              -WorkingDirectory $installDir `
              -PassThru
            Start-Sleep -Seconds 10
            if ($application.HasExited) {
              throw "$installerName application exited during startup with code $($application.ExitCode)."
            }
            Stop-Process -Id $application.Id -Force

            $uninstaller = Join-Path $installDir "unins000.exe"
            if (-not (Test-Path $uninstaller)) {
              throw "$installerName did not create an uninstaller."
            }
            $uninstall = Start-Process `
              -FilePath $uninstaller `
              -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
              -PassThru `
              -Wait
            if ($uninstall.ExitCode -ne 0) {
              throw "$installerName uninstaller exited with code $($uninstall.ExitCode)."
            }
          }

      - name: Create checksums
        shell: pwsh
        run: |
          $installers = @(
            "p-tifico-backup-Setup.exe",
            "p-tifico-backup-PC2-Setup.exe"
          )
          foreach ($name in $installers) {
            $path = Join-Path "dist" $name
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" |
              Set-Content "$path.sha256" -Encoding ascii
            Get-Item $path
            Get-Content "$path.sha256"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: p-tifico-backup-windows-installer
          path: |
            dist/p-tifico-backup-Setup.exe
            dist/p-tifico-backup-Setup.exe.sha256
            dist/p-tifico-backup-PC2-Setup.exe
            dist/p-tifico-backup-PC2-Setup.exe.sha256
          if-no-files-found: error
          compression-level: 0
