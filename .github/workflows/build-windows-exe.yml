name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        run: python -m pip install "pyinstaller==6.16.0" "pillow==12.3.0"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not installed."
          }

      - name: Build GUI executable
        run: pyinstaller --noconfirm --clean p-tifico-backup.spec

      - name: Build Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "installer\p-tifico-backup.iss"

      - name: Install and verify packaged application
        shell: pwsh
        run: |
          $installer = Resolve-Path "dist\p-tifico-backup-Setup.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "p-tifico-backup-installed"
          $install = Start-Process `
            -FilePath $installer `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir" `
            -PassThru `
            -Wait
          if ($install.ExitCode -ne 0) {
            throw "Installer exited with code $($install.ExitCode)."
          }

          $requiredFiles = @(
            "p-tifico-backup.exe",
            "SCADA_BONT.ico",
            "RUNMONITORING FINAL.png",
            "G1MONITOR.jpg.png",
            "G2MONITOR.jpg.png",
            "SYSTEMCONFIG_DARK.png",
            "AUXILIARY_MATCHED.png",
            "MANUAL_MAPPING_G1_G2.png",
            "MANUAL_COMMUNICATION_SETTINGS.png",
            "MANUAL_PROCESS_TREND.png",
            "MANUAL_BACKUP_EXPLORER.png",
            "MANUAL_MONITOR_TV_BREAKER.png",
            "MONITOR V55.html",
            "CommunicationConfig.json",
            "MQTTConfig.json",
            "UIRealtimeBindings.json",
            "MonitorTVConfig.json",
            "CBZ8000AppData.json"
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path (Join-Path $installDir $file))) {
              throw "Missing installed file: $file"
            }
          }

          $listSettings = @(Get-ChildItem $installDir -Filter "ListSetting *.csv")
          $statusSettings = @(Get-ChildItem $installDir -Filter "StatusSetting *.csv")
          if ($listSettings.Count -lt 24 -or $statusSettings.Count -lt 24) {
            throw "Incomplete settings: $($listSettings.Count) ListSetting and $($statusSettings.Count) StatusSetting files."
          }

          $env:SCADA_SELF_TEST = "1"
          $selfTest = Start-Process `
            -FilePath (Join-Path $installDir "p-tifico-backup.exe") `
            -WorkingDirectory $installDir `
            -PassThru `
            -Wait
          Remove-Item Env:\SCADA_SELF_TEST
          if ($selfTest.ExitCode -ne 0) {
            throw "Packaged self-test exited with code $($selfTest.ExitCode)."
          }

          $application = Start-Process `
            -FilePath (Join-Path $installDir "p-tifico-backup.exe") `
            -WorkingDirectory $installDir `
            -PassThru
          Start-Sleep -Seconds 10
          if ($application.HasExited) {
            throw "Installed application exited during startup with code $($application.ExitCode)."
          }
          Stop-Process -Id $application.Id -Force

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) {
            throw "Installer did not create an uninstaller."
          }
          $uninstall = Start-Process `
            -FilePath $uninstaller `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" `
            -PassThru `
            -Wait
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstaller exited with code $($uninstall.ExitCode)."
          }

      - name: Create checksum
        shell: pwsh
        run: |
          $installer = "dist\p-tifico-backup-Setup.exe"
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  p-tifico-backup-Setup.exe" |
            Set-Content "dist\p-tifico-backup-Setup.exe.sha256" -Encoding ascii
          Get-Item $installer
          Get-Content "dist\p-tifico-backup-Setup.exe.sha256"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: p-tifico-backup-windows-installer
          path: |
            dist/p-tifico-backup-Setup.exe
            dist/p-tifico-backup-Setup.exe.sha256
          if-no-files-found: error
          compression-level: 0
